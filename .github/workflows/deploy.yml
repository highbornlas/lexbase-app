name: Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lexbase-app/package-lock.json

      - name: Install dependencies
        working-directory: lexbase-app
        run: npm ci

      - name: Validate version and release notes
        working-directory: lexbase-app
        run: npm run release:check

      - name: Run regression tests
        working-directory: lexbase-app
        run: npm test

      # Cloudflare Workers Builds is the sole automatic production publisher.
      - name: Build production Worker without publishing
        working-directory: lexbase-app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run cf:build
